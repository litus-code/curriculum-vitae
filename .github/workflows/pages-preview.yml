name: Preview (GitHub Pages)
on:
  push:
    branches:
      - feat/carles-far-os-nuxt4-foundation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: carlesfar-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate up-to-date CV PDF
        run: |
          python -m pip install --disable-pip-version-check reportlab pillow
          python scripts/build_cv_pdf.py
      - name: Verify and build static site
        env:
          NUXT_APP_BASE_URL: /curriculum-vitae/
        run: npm run check
      - name: Check published PDF content
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.output/public/carles-far-cv-v2-1.pdf')
          assert p.exists(), "Generated PDF missing in Pages artifact"
          assert p.stat().st_size > 10000, "Generated PDF unexpectedly small"
          legacy = Path('.output/public/carles-far-cv.pdf')
          assert legacy.exists() and legacy.read_bytes() == p.read_bytes(), "Legacy PDF not synchronized"
          print(f"Both CV PDF paths verified in static artifact: {p.stat().st_size} bytes")
          PY
      - name: Prepare Pages artifact
        run: touch .output/public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
