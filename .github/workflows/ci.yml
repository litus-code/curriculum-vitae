name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies (bootstrap phase)
        run: npm install --no-audit --no-fund
      - name: Verify typecheck, tests and static generation
        run: npm run check
